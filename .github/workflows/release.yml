# 推 v* 标签 → 自动出发布包并挂到 Release。
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# 为什么复用 publish.ps1 而不在 YAML 里重写一遍发布步骤：发布参数的每一格都是踩过坑的
# （单文件 + 内嵌原生库 + 压缩、tar 的 --mode=755、相对路径躲开 MSYS 的冒号），
# 抄一份到 YAML 就是第二份真相，迟早漂。
#
# ⚠️ 跑在 windows-latest 上：publish.ps1 是 Windows 形态（tar 那一行用的是反斜杠相对路径）。
#    它在 Windows 上能**跨**发布 linux-x64（本机验过），所以一个 job 出两个包。
# ⚠️ publish.ps1 里的 tar 是 GNU tar（MSYS 那个）：GitHub 的 Windows runner 上它在
#    C:\Program Files\Git\usr\bin 里、默认不在 PATH ⇒ 下面显式加进去。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 版本号（取自标签，去掉 v）
        id: v
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: GNU tar 进 PATH（publish.ps1 用它压 linux 包并置可执行位）
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH

      - name: 出包
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.v.outputs.version }}

      - name: 挂到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # ⚠️ 只挂**这一次版本**的产物：`publish/` 是所有版本共用的目录，上一版的包还在那里。
          # 不限定版本的话，一次发布会把旧包一起挂上去——而 Release 的资产是用户下载的那一份。
          $assets = @(Get-ChildItem publish -File -Filter "lilara-${{ steps.v.outputs.version }}-*" |
            Where-Object { $_.Extension -in ".zip", ".gz" } |
            ForEach-Object { $_.FullName })
          $sums = Join-Path "publish" "SHA256SUMS"
          if (Test-Path $sums) { $assets += (Resolve-Path $sums).Path }
          if (-not $assets) { throw "publish 里没有产物，别把空 release 发出去" }

          $notes = @(
            "核心的发布包：``lilara-${{ steps.v.outputs.version }}-win-x64.zip`` 与 ``lilara-${{ steps.v.outputs.version }}-linux-x64.tar.gz``。"
            "解压就是一个**自包含单文件**（目标机不需要装 .NET），校验和见 ``SHA256SUMS``。"
            ""
            "配套的浏览器头 [Cadenza](https://github.com/Aidara233/Cadenza)、"
            "以及一条命令就能跑起来的拼合仓 [AgentLilarasCadenza](https://github.com/Aidara233/AgentLilarasCadenza)。"
          )
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          gh release create $tag $assets --title "Lilara Core $tag" --notes-file notes.md 2>$null
          if ($LASTEXITCODE -ne 0) {
            # 同一个标签重跑时 release 已经在：改成覆盖上传，别让流水线红在这里。
            gh release upload $tag $assets --clobber
          }
